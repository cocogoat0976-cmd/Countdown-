<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core ❤️ Reve</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffd1ff);
}
.card{
background:white;
padding:30px;
border-radius:24px;
max-width:700px;
width:90%;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}
h1{color:#d6336c}
.days{font-size:1.5rem;font-weight:bold;color:#c2255c}
</style>
</head>
<body>
<div class="card">
<h1>❤️ Core & Reve ❤️</h1>
<p>Every day with you is special.</p>
<div class="days" id="days"></div>
<p>Since April 17 ❤️</p>
</div>

<script>
// Change the year if needed
const startDate = new Date("2025-04-17T00:00:00");

function update(){
  const now = new Date();
  const diff = now - startDate;
  const days = Math.floor(diff / (1000*60*60*24));
  document.getElementById("days").innerText =
    "Together for " + days + " days";
}
update();
setInterval(update,60000);
</script>
</body>
</html>
